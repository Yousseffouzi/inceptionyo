services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    pull_policy: build
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    pull_policy: build
    env_file:
      - .env
    secrets:
      - wp_admin_password
      - wp_user_password
      - db_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: on-failure
    depends_on:
      - mariadb
  nginx:
    build: ./requirements/nginx
    image: nginx
    pull_policy: build
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    restart: on-failure
    depends_on:
      - wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
networks:
  inception:
    driver: bridge
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mait-ijj/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mait-ijj/data/wordpress
